[project]
name = "python-mastery"
version = "0.1.0"
description = "Workspace luyện tập và làm chủ Python từ cơ bản đến nâng cao"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

# ==========================================
# 1. CẤU HÌNH RUFF (Linter + Formatter)
# ==========================================
[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

# Bỏ qua các thư mục không cần kiểm tra
exclude = [
    ".git",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
]

[tool.ruff.lint]
# E, W: pycodestyle (Chuẩn PEP 8)
# F: Pyflakes (Lỗi cú pháp, biến chưa dùng)
# I: isort (Tự động sắp xếp thứ tự import)
# B: flake8-bugbear (Phát hiện các bug tiềm ẩn và bad practices)
# UP: pyupgrade (Gợi ý nâng cấp cú pháp lên Python mới nhất)
# SIM: flake8-simplify (Gợi ý viết code ngắn gọn, Pythonic hơn)
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

# Bỏ qua lỗi E501 (dòng quá dài) trong comment hoặc chuỗi dài
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ==========================================
# 2. CẤU HÌNH MYPY (Kiểm tra kiểu dữ liệu tĩnh)
# ==========================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true       # Vẫn kiểm tra logic bên trong hàm chưa gắn Type Hints
disallow_untyped_defs = false   # Cho phép viết hàm không cần Type Hints ở các bài cơ bản
ignore_missing_imports = true   # Tránh báo lỗi khi dùng thư viện ngoài chưa có stub

# Bật chế độ kiểm tra nghiêm ngặt (Strict Mode) riêng cho phần Nâng cao và Utils
[[tool.mypy.overrides]]
module = ["06_advanced.*", "utils.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

# ==========================================
# 3. CẤU HÌNH PYTEST (Kiểm thử tự động)
# ==========================================
[tool.pytest.ini_options]
minversion = "8.0"
# Thêm thư mục gốc vào PYTHONPATH để import trực tiếp (VD: from utils.benchmark import timer)
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
# -ra: Hiển thị tóm tắt lý do fail/skip | -q: Giao diện gọn gàng
addopts = "-ra -q"